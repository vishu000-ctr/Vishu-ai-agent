<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vishu AI Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    padding: 16px 20px;
    text-align: center;
    width: 100%;
    max-width: 600px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .title h1 { margin: 0; color: #ff6b35; font-size: 24px; }
  header .title p { margin: 2px 0 0; font-size: 13px; color: #aaa; }
  #clear-btn {
    background: none;
    border: 1px solid #444;
    color: #ccc;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
  }
  #clear-btn:hover { background: #2d2d44; }
  #chat-container {
    width: 100%;
    max-width: 600px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 400px;
    max-height: 65vh;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #ff6b35;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #2d2d44;
    border-bottom-left-radius: 4px;
  }
  .typing { align-self: flex-start; color: #888; font-style: italic; }
  #input-area { display: flex; gap: 8px; padding: 16px 0; align-items: center; }
  #input-box {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: none;
    outline: none;
    background: #2d2d44;
    color: white;
    font-size: 15px;
  }
  #mic-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: #2d2d44;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #mic-btn.recording {
    background: #ff3b3b;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,59,59,0.5); }
    70% { box-shadow: 0 0 0 10px rgba(255,59,59,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,59,59,0); }
  }
  #send-btn {
    padding: 12px 20px;
    border-radius: 24px;
    border: none;
    background: #ff6b35;
    color: white;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #e55a2b; }
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1>⚡ Vishu</h1>
      <p>Aapka apna AI agent</p>
    </div>
    <button id="clear-btn">New chat</button>
  </header>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <input id="input-box" type="text" placeholder="Kuch pooch lo..." />
      <button id="mic-btn" title="Voice message">🎤</button>
      <button id="send-btn">Send</button>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputBox = document.getElementById("input-box");
  const sendBtn = document.getElementById("send-btn");
  const micBtn = document.getElementById("mic-btn");
  const clearBtn = document.getElementById("clear-btn");

  const STORAGE_KEY = "vishu_chat_history";

  let chatHistory = [];
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) chatHistory = JSON.parse(saved);
  } catch (e) {
    chatHistory = [];
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
    } catch (e) {}
  }

  function renderMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function loadHistoryToScreen() {
    messagesEl.innerHTML = "";
    chatHistory.forEach((m) => {
      renderMessage(m.content, m.role === "user" ? "user" : "bot");
    });
  }
  loadHistoryToScreen();

  async function sendMessage() {
    const text = inputBox.value.trim();
    if (!text) return;

    renderMessage(text, "user");
    chatHistory.push({ role: "user", content: text });
    saveHistory();
    inputBox.value = "";

    const typingEl = renderMessage("Vishu likh raha hai...", "typing");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ history: chatHistory }),
      });
      const data = await res.json();
      typingEl.remove();
      const reply = data.reply || "Kuch error aa gaya.";
      renderMessage(reply, "bot");
      chatHistory.push({ role: "assistant", content: reply });
      saveHistory();
    } catch (e) {
      typingEl.remove();
      renderMessage("Server se connect nahi ho paya.", "bot");
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputBox.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  clearBtn.addEventListener("click", () => {
    if (confirm("Are you sure you want to delete the chat history?")) {
      chatHistory = [];
      saveHistory();
      messagesEl.innerHTML = "";
    }
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      inputBox.value = transcript;
      sendMessage();
    };

    recognition.onerror = () => {
      isRecording = false;
      micBtn.classList.remove("recording");
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove("recording");
    };

    micBtn.addEventListener("click", () => {
      if (isRecording) {
        recognition.stop();
        isRecording = false;
        micBtn.classList.remove("recording");
      } else {
        recognition.start();
        isRecording = true;
        micBtn.classList.add("recording");
      }
    });
  } else {
    micBtn.addEventListener("click", () => {
      alert("Aapka browser voice input support nahi karta. Chrome use karo.");
    });
  }
</script>
</body>
</html>
